services:
  - type: web
    name: cymor-movie-hub-api
    env: python
    plan: free
    buildCommand: >
      pip install --upgrade pip &&
      pip install --only-binary :all: fastapi==0.115.5 uvicorn[standard]==0.32.1 httpx==0.27.2 pydantic==2.9.2 python-multipart==0.0.12 rich==13.9.4 click==8.1.8 beautifulsoup4==4.12.3 &&
      pip install moviebox-api --no-deps --no-build-isolation
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
